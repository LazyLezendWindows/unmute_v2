<!DOCTYPE html>
<html lang="en" class="h-100">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="Unmute - Connect without the pressure. A conversation-first social platform." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Unmute" />
    <!-- Fonts ship with the app (see main.ts): nothing on the first screen needs the internet. -->
    <link rel="stylesheet" href="/vendor/remixicon/remixicon.css" />
    <style>
      .splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.4rem;
        font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
        background: linear-gradient(180deg, #fff0f5 0%, #ffffff 50%, #f4eeff 100%);
      }
      .splash img {
        filter: drop-shadow(0 10px 20px rgba(192, 0, 120, 0.25));
      }
      .splash-word {
        font-family: 'Nunito', system-ui, sans-serif;
        font-weight: 900;
        font-size: 3.2rem;
        letter-spacing: -0.02em;
        color: #4a005b;
      }
      .splash-word span + span {
        color: #f21872;
      }
      .splash p {
        margin: 0;
        text-align: center;
        font-size: 1.05rem;
        line-height: 1.4;
        color: #81768b;
      }
      .splash-offline {
        display: none;
        margin-top: 1.2rem !important;
        padding: 0.7rem 1.1rem;
        border-radius: 1rem;
        background: #fff4dc;
        color: #7a4d00 !important;
        font-size: 0.95rem !important;
      }
      .is-offline .splash-offline {
        display: block;
      }
      @media (prefers-color-scheme: dark) {
        .splash { background: #0f0714; }
        .splash-word { color: #fff0f5; }
      }
    </style>
    <title>Unmute — Connect without the pressure</title>
    <script type="module" crossorigin src="/assets/index-DSGYyBrR.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-CgC6BAw6.css">
  <link rel="manifest" href="/manifest.webmanifest"></head>
  <body class="h-100 d-flex flex-column overflow-x-hidden">
    <div id="app" class="h-100 d-flex flex-column">
      <!-- Splash: shown until the app mounts and replaces it -->
      <div class="splash" role="status" aria-label="Loading Unmute">
        <img src="/favicon.svg" alt="" width="120" height="110" />
        <div class="splash-word"><span>Un</span><span>mute</span></div>
        <p>Real People<br />Real Conversations</p>
        <p class="splash-offline" role="alert">No internet connection.<br />Unmute will open when you're back online.</p>
      </div>
    </div>
    <script>
      // Before the app itself loads: say so when there's no connection, and reload once it's back.
      (function () {
        var splash = document.querySelector('.splash');
        function update() {
          if (splash && splash.isConnected) splash.classList.toggle('is-offline', !navigator.onLine);
        }
        update();
        window.addEventListener('offline', update);
        window.addEventListener('online', function () {
          if (splash && splash.isConnected) location.reload();
        });
      })();
    </script>
  </body>
</html>
